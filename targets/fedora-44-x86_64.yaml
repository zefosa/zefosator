# https://koji.fedoraproject.org/koji/packageinfo?packageID=8
vendor: fedora
os_version: "44"
arch: x86_64
kernel:
  version: 7.2.9
  release: "200"
zfs:
  tag: zfs-2.4.4
  version: 2.4.4
boot:
  shim: {version: "16.1", release: "7"}
  cloud_image: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
# tar + sha256 archives for `zefosator pack`; paths are under output/ (Jinja2: see `zefosator plan`)
archives:
  fedora44-x86_64-zfs-userspace-packages:
    - "{{ target_id }}/zfs/libnvpair3-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.{{ arch }}.rpm"
    - "{{ target_id }}/zfs/libuutil3-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.{{ arch }}.rpm"
    - "{{ target_id }}/zfs/libzfs7-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.{{ arch }}.rpm"
    - "{{ target_id }}/zfs/libzfs7-devel-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.{{ arch }}.rpm"
    - "{{ target_id }}/zfs/libzpool7-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.{{ arch }}.rpm"
    - "{{ target_id }}/zfs/python3-pyzfs-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.noarch.rpm"
    - "{{ target_id }}/zfs/zfs-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.{{ arch }}.rpm"
    - "{{ target_id }}/zfs/zfs-dracut-{{ zfs.version }}-{{ zfs.release }}.fc{{ os_major }}.noarch.rpm"
  fedora44-x86_64-zfs-kernel-packages:
