    - "{{ target_id }}/kernel/kernel-devel-matched-{{ kernel_version }}-{{ zefosa_release }}.{{ arch }}.rpm"
    - "{{ target_id }}/kernel/kernel-modules-{{ kernel_version }}-{{ zefosa_release }}.{{ arch }}.rpm"
    - "{{ target_id }}/kernel/kernel-modules-core-{{ kernel_version }}-{{ zefosa_release }}.{{ arch }}.rpm"
    - "{{ target_id }}/kernel/kernel-modules-extra-{{ kernel_version }}-{{ zefosa_release }}.{{ arch }}.rpm"
    - "{{ target_id }}/kernel/kernel-modules-internal-{{ kernel_version }}-{{ zefosa_release }}.{{ arch }}.rpm"
