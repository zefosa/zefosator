# Pinned inputs of the distro-independent boot packages (spec 2026-10-09 section 6.3).
# Bump a release whenever its package is rebuilt (e.g. ZBM after a zefosa Fedora kernel update).
zfsbootmenu:
  version: "3.1.0"
  repo: https://github.com/zbm-dev/zfsbootmenu.git
  tag: v3.1.0                # a tag or a commit
  release: 1
  build_packages: [dracut, kmod, kexec-tools, fzf, mbuffer, perl, perl-YAML-PP, perl-Sort-Versions,
                   perl-boolean, make, git-core, systemd-ukify, systemd-boot-unsigned, sbsigntools,
                   binutils, xz, util-linux, ncurses, findutils]
  # Extra tools in the recovery image: packages to install, and the commands to put in the image.
  recovery_packages: [efibootmgr, mokutil, sbsigntools, gdisk, parted, cryptsetup, lvm2, mdadm,
                      smartmontools, nvme-cli, iproute, ethtool, rsync, curl, openssh-clients,
