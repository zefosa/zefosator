# Settings shared by every target. String values are Jinja2 templates over this file's values.

# Pinned inputs of the distro-independent boot packages (spec 2026-10-09 section 6.3).
# Bump a release whenever its package is rebuilt (e.g. ZBM after a zefosa Fedora kernel update).
boot:
  zfsbootmenu:
    version: "3.1.0"
    repo: https://github.com/zbm-dev/zfsbootmenu.git
    tag: v3.1.0                # a tag or a commit; the build records the commit it resolves to
    release: 1
    build_packages: [dracut, kmod, kexec-tools, fzf, mbuffer, perl, perl-YAML-PP, perl-Sort-Versions,
                     perl-boolean, make, git-core, systemd-ukify, systemd-boot-unsigned, sbsigntools,
                     binutils, xz, util-linux, ncurses, findutils]
    # Extra tools in the recovery image: packages to install, and the commands to put in the image.
    recovery_packages: [efibootmgr, mokutil, sbsigntools, gdisk, parted, cryptsetup, lvm2, mdadm,
                        smartmontools, nvme-cli, iproute, ethtool, rsync, curl, openssh-clients,
                        vim-minimal, less, strace, lsof, pv, zstd, pciutils, usbutils, dosfstools]
    recovery_tools: [efibootmgr, mokutil, sbverify, gdisk, sgdisk, parted, cryptsetup, lvm, mdadm,
                     smartctl, nvme, ip, ethtool, rsync, curl, ssh, scp, vi, less, strace, lsof, pv,
                     zstd, lspci, lsusb, mkfs.vfat, fsck.vfat]
  refind:
    version: "0.14.2"
    upstream_release: "5.fc44"   # Fedora's release of the rEFInd-unsigned-x64 RPM
    release: 1                   # zefosa-refind package release
    url: "https://kojipkgs.fedoraproject.org/packages/rEFInd/{{ boot.refind.version }}/{{ boot.refind.upstream_release }}/noarch/rEFInd-unsigned-x64-{{ boot.refind.version }}-{{ boot.refind.upstream_release }}.noarch.rpm"
    sha256: b00339df78acc802151275a0afddfa3d368ba5aaaa357cea44681b781033fc8b
  ca:
    version: "1"
    release: 1
  tools:
    version: "1.0"
    release: 1

# Where `zefosator upload` publishes archives: <webdav_url><name>.tar and <name>.sha256.
upload:
  webdav_url: https://cloud.fogas.net/public.php/webdav/
